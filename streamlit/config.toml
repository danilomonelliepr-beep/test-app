# Tema dell'applicazione. Gli stessi token di ui.py: se qui cambia un colore,
# deve cambiare anche là.
#
# QUESTO FILE NON È NECESSARIO perché l'app si veda giusta: `ui.py` riapplica
# gli stessi colori via CSS, proprio perché una cartella che comincia col punto
# è invisibile nel gestore file e sparisce se il progetto viene caricato
# trascinandolo nel browser. Quello che si perde senza questo file è il limite
# di caricamento (torna a 200 MB) e la barra degli strumenti ridotta.
[theme]
base = "light"
primaryColor = "#15616D"            # accento: dice dove si può agire, mai cosa significa
backgroundColor = "#F1F4F7"         # carta
secondaryBackgroundColor = "#FFFFFF"# superficie: barra laterale, riquadri, tabelle
textColor = "#17212B"               # inchiostro (contrasto 13:1 sulla carta)
font = "sans serif"

# Per lavorare al buio, sostituire il blocco qui sopra con questo:
# base = "dark"
# primaryColor = "#4EA8B8"
# backgroundColor = "#131A21"
# secondaryBackgroundColor = "#1B242D"
# textColor = "#E8EDF2"

[server]
maxUploadSize = 50

[client]
toolbarMode = "minimal"
